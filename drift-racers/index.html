<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ドリフトレーサーズ 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=64">
</head>
<body>

<canvas id="renderCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;touch-action:none;outline:none;"></canvas>

<div id="rotate-prompt"><div class="icon">📱</div><p>横向きにしてください</p></div>

<div id="title-screen">
  <div class="account-bar" id="account-bar"></div>
  <div class="title-logo">
    <div class="title-main">DRIFT RACERS</div>
    <div class="title-sub">ドリフトレーサーズ</div>
  </div>
  <div class="course-label">🏁 ドリームサーキット - 3 LAPS</div>

  <div class="mode-select" id="mode-select"></div>

  <div class="select-main">
    <div class="select-preview-panel">
      <div id="preview-container">
        <canvas id="preview-canvas"></canvas>
      </div>
      <div class="char-desc" id="char-desc"></div>
      <div class="char-stats-panel" id="char-stats-panel"></div>
      <div class="skill-preview" id="skill-preview"></div>
    </div>
    <div class="select-right-panel">
      <div class="section-title">👤 キャラクター</div>
      <div class="char-grid-wrapper">
        <button class="char-arrow" id="char-arrow-left">&#x276E;</button>
        <div class="char-grid-viewport">
          <div class="char-select" id="char-select"></div>
        </div>
        <button class="char-arrow" id="char-arrow-right">&#x276F;</button>
      </div>
      <div class="section-title">🏎️ マシン</div>
      <div class="kart-select" id="kart-select"></div>
      <div class="section-title">🔧 装備</div>
      <div class="equip-select" id="equip-select"></div>
    </div>
  </div>

  <div class="title-buttons">
    <button class="start-btn" id="start-btn">START RACE</button>
    <button class="ranking-btn" id="ranking-btn">RANKING</button>
  </div>
</div>

<div id="login-modal" class="login-modal">
  <div class="login-content">
    <button class="login-close" id="login-close">&times;</button>
    <h3 class="login-title">LOGIN</h3>
    <div id="login-tabs" class="login-tabs">
      <button class="login-tab active" data-tab="login">ログイン</button>
      <button class="login-tab" data-tab="signup">新規登録</button>
    </div>
    <div id="login-form" class="login-form">
      <input type="email" id="login-email" placeholder="メールアドレス" class="login-input">
      <input type="password" id="login-pass" placeholder="パスワード" class="login-input">
      <input type="text" id="login-name" placeholder="表示名" class="login-input" style="display:none">
      <button class="login-submit" id="login-submit">ログイン</button>
      <div class="login-divider"><span>or</span></div>
      <button class="login-google" id="login-google">Googleでログイン</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>
</div>

<div id="ranking-screen" class="ranking-screen">
  <h2 class="ranking-title">RANKING</h2>
  <div class="ranking-list" id="ranking-list"></div>
  <button class="ranking-back" id="ranking-back">BACK</button>
</div>

<div id="hud">
  <div class="hud-top">
    <div id="position-display" class="hud-box">1<span class="suffix">st</span></div>
    <div id="lap-display" class="hud-box">LAP 1/3</div>
    <div id="item-box"></div>
  </div>
  <div style="display:flex;justify-content:space-between;margin-top:6px">
    <div id="speed-display" class="hud-box">0 km/h</div>
    <div id="time-display" class="hud-box">0:00.00</div>
  </div>
  <div id="ring-display" class="hud-box" style="position:fixed;top:80px;right:20px;color:#ffdd00;border:none;background:rgba(255,220,0,0.15)"></div>
  <div id="skill-gauge"></div>
</div>

<div id="countdown"><div class="num" id="cd-num">3</div></div>

<div id="results">
  <h2 id="result-title">FINISH!</h2>
  <div class="time" id="result-time"></div>
  <ol class="result-list" id="result-list"></ol>
  <button class="retry-btn" id="retry-btn">RETRY</button>
</div>

<canvas id="minimap" width="260" height="260"></canvas>

<div id="boost-bar"><div id="boost-fill"></div></div>

<div id="warning-flash"></div>

<button id="fullscreen-btn" title="全画面切替">&#x26F6;</button>

<div id="mobile-controls">
  <div class="ctrl-row">
    <div class="joystick" id="joystick">
      <div class="joy-base" id="joy-base">
        <div class="joy-thumb" id="joy-thumb"></div>
      </div>
    </div>
    <div class="action-btns">
      <div class="ctrl-btn btn-skill" data-key="skill">SKILL</div>
      <div class="ctrl-btn btn-item" data-key="item">ITEM</div>
      <div class="ctrl-btn btn-drift" data-key="drift">DRIFT</div>
      <div class="ctrl-btn btn-brake" data-key="brake">BRAKE</div>
      <div class="ctrl-btn btn-accel" data-key="accel">GAS</div>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Babylon.js -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<!-- Game modules -->
<script src="js/audio.js?v=64"></script>
<script src="js/config.js?v=64"></script>
<script src="js/firebase.js?v=64"></script>
<script src="js/track.js?v=64"></script>
<script src="js/items.js?v=64"></script>
<script src="js/kart.js?v=64"></script>
<script src="js/input.js?v=64"></script>
<script src="js/graphics.js?v=64"></script>
<script src="js/hud.js?v=64"></script>
<script src="js/main.js?v=64"></script>
</body>
</html>
