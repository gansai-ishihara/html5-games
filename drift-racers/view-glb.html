<!DOCTYPE html>
<html><head><title>GLB Viewer</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<style>body{margin:0;overflow:hidden;background:#222}canvas{width:100%;height:100%}</style>
</head><body>
<canvas id="c" style="width:100%;height:100%"></canvas>
<script>
var canvas = document.getElementById('c');
var engine = new BABYLON.Engine(canvas, true);
var scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.15, 0.15, 0.2, 1);

var camera = new BABYLON.ArcRotateCamera('cam', -Math.PI/4, Math.PI/3, 10, BABYLON.Vector3.Zero(), scene);
camera.attachControl(canvas, true);
camera.wheelPrecision = 20;

var hemi = new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0,1,0), scene);
hemi.intensity = 1.2;
var dir = new BABYLON.DirectionalLight('d', new BABYLON.Vector3(-1,-2,1), scene);
dir.intensity = 0.8;

var file = new URLSearchParams(location.search).get('file') || 'models/castle.glb';
BABYLON.SceneLoader.ImportMesh('', '', file, scene, function(meshes) {
  var bounds = meshes[0].getHierarchyBoundingVectors(true);
  var center = bounds.min.add(bounds.max).scale(0.5);
  var size = bounds.max.subtract(bounds.min);
  var maxDim = Math.max(size.x, size.y, size.z);
  camera.target = center;
  camera.radius = maxDim * 1.5;
  document.title = 'Loaded: ' + file + ' (' + meshes.length + ' meshes)';
});

engine.runRenderLoop(function(){ scene.render(); });
window.addEventListener('resize', function(){ engine.resize(); });
</script>
</body></html>
